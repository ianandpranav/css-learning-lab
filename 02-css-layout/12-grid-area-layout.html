<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Area Layout</title>

    <style>
        .page {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px 1fr 60px;
            grid-template-areas:
                "header header"
                "sidebar content"
                "footer footer";

            min-height: 500px;
            gap: 10px;
        }

        .header {
            grid-area: header;
            padding: 20px;
            background-color: lightblue;
        }

        .sidebar {
            grid-area: sidebar;
            padding: 20px;
            background-color: lightgray;
        }

        .content {
            grid-area: content;
            padding: 20px;
            background-color: beige;
        }

        .footer {
            grid-area: footer;
            padding: 20px;
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <h1>CSS Grid Area Layout</h1>

    <div class="page">

        <header class="header">
            Header
        </header>

        <aside class="sidebar">
            Sidebar
        </aside>

        <main class="content">
            Main Content
        </main>

        <footer class="footer">
            Footer
        </footer>

    </div>

</body>
</html>
