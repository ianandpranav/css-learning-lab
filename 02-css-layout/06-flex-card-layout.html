<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Card Layout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .card {
            width: 220px;
            padding: 20px;
            border: 1px solid black;
            border-radius: 8px;
            text-align: center;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            margin-bottom: 15px;
        }

        .card button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Flexbox Card Layout</h1>

    <div class="card-container">

        <div class="card">
            <h2>Java</h2>
            <p>Learn Java programming and object-oriented concepts.</p>
            <button>Learn More</button>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Practice JavaScript fundamentals and web development.</p>
            <button>Learn More</button>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Build layouts and responsive interfaces using CSS.</p>
            <button>Learn More</button>
        </div>

    </div>

</body>
</html>
