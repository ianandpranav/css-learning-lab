
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            max-width: 900px;
            min-height: 520px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(30, 41, 59, 0.12);
        }

        .login-banner {
            background: #2563eb;
            color: white;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-banner h1 {
            font-size: 34px;
            margin-bottom: 18px;
            line-height: 1.2;
        }

        .login-banner p {
            line-height: 1.8;
            color: #dbeafe;
        }

        .login-form {
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .remember input {
            width: auto;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .signup-text {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            .login-container {
                grid-template-columns: 1fr;
                max-width: 450px;
            }

            .login-banner {
                padding: 28px;
            }

            .login-banner h1 {
                font-size: 27px;
            }

            .login-form {
                padding: 30px;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            .login-banner,
            .login-form {
                padding: 22px;
            }

            .login-form h2 {
                font-size: 24px;
            }

            .form-options {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <main class="login-container">

        <section class="login-banner">
            <h1>Welcome Back!</h1>
            <p>
                Sign in to access your workspace, manage your tasks,
                and continue working toward your goals.
            </p>
        </section>

        <form class="login-form" action="#" method="get">
            <h2>Sign In</h2>

            <p class="subtitle">
                Enter your details to access your account.
            </p>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>

                <a href="#forgot-password">Forgot password?</a>
            </div>

            <button class="login-button" type="submit">
                Sign In
            </button>

            <p class="signup-text">
                Don't have an account?
                <a href="#signup">Create an account</a>
            </p>
        </form>

    </main>

</body>
</html>
