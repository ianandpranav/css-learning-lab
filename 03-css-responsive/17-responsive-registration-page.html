
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Registration Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .registration-card {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .page-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .page-heading h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .page-heading p {
            color: #64748b;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            min-height: 45px;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font: inherit;
            background: #ffffff;
        }

        input:focus,
        select:focus {
            outline: 2px solid #bfdbfe;
            border-color: #2563eb;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        .terms input {
            width: 16px;
            min-height: 16px;
            margin-top: 3px;
            flex-shrink: 0;
        }

        .terms label {
            font-weight: normal;
        }

        .terms a,
        .login-link a {
            color: #2563eb;
            text-decoration: none;
        }

        .terms a:hover,
        .login-link a:hover {
            text-decoration: underline;
        }

        .submit-button {
            width: 100%;
            min-height: 48px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #1d4ed8;
        }

        .login-link {
            margin-top: 22px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 520px) {
            .registration-card {
                padding: 24px 18px;
            }

            .page-heading h1 {
                font-size: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 17px;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>

    <main class="registration-card">

        <header class="page-heading">
            <h1>Create Your Account</h1>
            <p>Fill in your details to get started.</p>
        </header>

        <form action="#" method="get">
            <div class="form-grid">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        placeholder="Enter first name"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        placeholder="Enter last name"
                        autocomplete="family-name"
                        required
                    >
                </div>

                <div class="form-group full-width">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group full-width">
                    <label for="country">Country</label>
                    <select id="country" name="country" required>
                        <option value="">Select your country</option>
                        <option value="india">India</option>
                        <option value="usa">United States</option>
                        <option value="uk">United Kingdom</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="full-width terms">
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the
                        <a href="#terms">Terms and Conditions</a>
                        and
                        <a href="#privacy">Privacy Policy</a>.
                    </label>
                </div>

                <div class="full-width">
                    <button class="submit-button" type="submit">
                        Create Account
                    </button>
                </div>

            </div>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="16-responsive-login-page.html">Sign in</a>
        </p>

    </main>

</body>
</html>
