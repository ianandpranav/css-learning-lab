<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            color: navy;
        }

        p {
            color: gray;
            font-size: 18px;
        }

        .highlight {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Internal CSS</h1>

    <p>CSS can be written inside the style element.</p>

    <p class="highlight">This paragraph uses a CSS class.</p>

</body>
</html>
