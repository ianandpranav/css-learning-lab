<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Styling</title>

    <style>
        h1 {
            text-align: center;
            text-transform: uppercase;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .bold {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Text Styling</h1>

    <p>
        CSS provides different properties for controlling text appearance.
    </p>

    <p class="bold">
        This text uses bold styling.
    </p>

</body>
</html>
