<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Selectors</title>

    <style>
        p {
            color: blue;
        }

        .highlight {
            font-weight: bold;
        }

        #special {
            background-color: lightgray;
        }
    </style>
</head>
<body>

    <h1>CSS Selectors</h1>

    <p>Element selector</p>
    <p class="highlight">Class selector</p>
    <p id="special">ID selector</p>

</body>
</html>
